id = "example_json"
name = "Example JSON"
kind = "ide"
readable = true

[detect]
any = [{ dir = "${TEST_DIR:-~}/json_sessions" }]

[[history]]
format = "json"
glob = "${TEST_DIR:-~}/json_sessions/**/*.json"
compression = "auto"
records_path = "messages"
fields = { message_id = "id", conversation_id = "session_id", role = "sender", content = "body", created_at = "time" }
role_map = { user = "user", bot = "assistant" }
timestamp = "unix_s"
cursor = "record_index"
keep_roles = ["user", "assistant"]
min_parse_rate = 0.8
