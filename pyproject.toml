[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penpal-mcp"
version = "0.4.0"
description = "Local-first personal activity memory layer for macOS"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "local-first",
    "macos",
    "ai-agent",
    "memory",
    "privacy",
    "claude",
    "cursor",
    "codex",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.5",
    "mcp>=1.30,<1.31",  # custom session handoff uses the MCP 1.30 low-level stdio API
]

[project.optional-dependencies]
macos = [
    # AppKit ships inside pyobjc-framework-Cocoa — there is no separate AppKit wheel.
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-WebKit",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Vision",
]
build = [
    "py2app>=0.28",
]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[project.urls]
Homepage = "https://github.com/Longfellow1/penpal"
Repository = "https://github.com/Longfellow1/penpal"
Issues = "https://github.com/Longfellow1/penpal/issues"
Changelog = "https://github.com/Longfellow1/penpal/blob/main/CHANGELOG.md"

[project.scripts]
penpal = "penpal.cli:main"
keypulse = "penpal.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["penpal*"]

[tool.setuptools.package-data]
penpal = ["hud/launcher/*.c"]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import the top-level evals/ harness
markers = [
    "slow: opt-in performance benchmarks; set PENPAL_RUN_SLOW=1",
    "system_smoke: opt-in tests that call real macOS system commands; set PENPAL_RUN_SYSTEM_SMOKE=1",
    "integration: real local-process runtime scenarios in isolated HOME",
]
